<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault Admin</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container" id="adminBox" style="display:none;">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2 style="color:var(--primary)">Command Center</h2>
            <button onclick="signOut(auth)" style="background:none; border:none; color:white;">Logout</button>
        </div>

        <h3 style="margin-bottom:10px;">User Requests</h3>
        <div id="reqList" style="margin-bottom:30px;"></div>

        <div class="request-box">
            <h3>Publish Content</h3>
            <textarea id="raw" placeholder="Paste Post text..."></textarea>
            <button id="btnParse" class="btn btn-main" style="margin:10px 0; width:auto; padding:5px 15px;">Smart Parse</button>
            <input type="text" id="t" placeholder="Title">
            <input type="text" id="u" placeholder="Download Link">
            <input type="text" id="p" placeholder="Poster URL">
            <button id="btnPub" class="btn btn-red">PUBLISH RELEASE</button>
        </div>

        <h3 style="margin-top:30px;">All Posts</h3>
        <div id="postList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARmXoxU0rLXLGZa4Tz1JtYzo4HjwrM-s8",
            authDomain: "mrxencodes.firebaseapp.com",
            projectId: "mrxencodes",
            storageBucket: "mrxencodes.firebasestorage.app",
            messagingSenderId: "595967941836",
            appId: "1:595967941836:web:9697bd551fab52f3167669"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "mynewp570@gmail.com") {
                document.getElementById('adminBox').style.display = 'block';
                initData();
            } else {
                window.location.href = "../index.html";
            }
        });

        function initData() {
            // Load Requests
            onSnapshot(query(collection(db, "requests"), orderBy("createdAt", "desc")), snap => {
                document.getElementById('reqList').innerHTML = snap.docs.map(d => `
                    <div class="req-item" style="display:flex; justify-content:space-between; align-items:center;">
                        <div><strong>${d.data().title}</strong><br><small>By: ${d.data().userName}</small></div>
                        <button onclick="deleteDoc(doc(db, 'requests', '${d.id}'))" style="color:gray; background:none; border:none;">Clear</button>
                    </div>`).join('');
            });

            // Load Posts
            onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), snap => {
                document.getElementById('postList').innerHTML = snap.docs.map(d => `
                    <div style="background:#111; padding:10px; margin-bottom:5px; display:flex; justify-content:space-between;">
                        <span>${d.data().title}</span>
                        <button onclick="deleteDoc(doc(db, 'posts', '${d.id}'))" style="color:red; background:none; border:none;">Del</button>
                    </div>`).join('');
            });
        }

        document.getElementById('btnParse').onclick = () => {
            const raw = document.getElementById('raw').value;
            document.getElementById('t').value = raw.split(/S\d+/i)[0].replace(/\./g, ' ').trim();
            document.getElementById('u').value = (raw.match(/https?:\/\/[^\s]+/) || [])[0] || '';
        };

        document.getElementById('btnPub').onclick = async () => {
            await addDoc(collection(db, "posts"), {
                title: document.getElementById('t').value,
                downloadURL: document.getElementById('u').value,
                posterURL: document.getElementById('p').value || 'https://via.placeholder.com/300x450',
                createdAt: serverTimestamp()
            });
            alert("Published!");
        };
    </script>
</body>
</html>
