<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PREMEO Ultra Pro V7.0</title>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05070a;
            --surface: #121826;
            --accent: #00f2ff;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --glass: rgba(255, 255, 255, 0.05);
            --grad: linear-gradient(135deg, #00f2ff 0%, #0062ff 100%);
            --tag-red: #ff4d4d;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; padding-bottom: 80px; }
        
        #loader { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .spinner { width: 50px; height: 50px; border: 3px solid var(--glass); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .glass-header { position: sticky; top: 0; z-index: 100; background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px); padding: 15px; border-bottom: 1px solid var(--glass); }
        .search-container { display: flex; gap: 10px; margin-top: 15px; background: var(--surface); padding: 12px 15px; border-radius: 12px; border: 1px solid var(--glass); }
        .search-container input { background: transparent; border: none; color: white; flex: 1; }
        
        .section-header { padding: 20px 15px 10px; display: flex; justify-content: space-between; align-items: center; }
        .section-header h3 { margin: 0; font-size: 18px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .see-all { color: var(--accent); font-size: 12px; cursor: pointer; font-weight: bold; }

        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 15px; }
        .horizontal-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 15px 15px; scrollbar-width: none; }
        
        .m-card { position: relative; border-radius: 12px; overflow: hidden; background: var(--surface); transition: transform 0.2s; cursor: pointer; min-width: 110px; }
        .m-card:active { transform: scale(0.95); }
        .m-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .m-card .info { padding: 8px; font-size: 11px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); position: absolute; bottom: 0; width: 100%; }
        
        /* NEW TAGS */
        .rating-tag { position: absolute; top: 8px; left: 8px; background: var(--tag-red); color: white; font-weight: 900; font-size: 9px; padding: 2px 6px; border-radius: 6px; z-index: 2; box-shadow: 0 2px 8px rgba(255,77,77,0.4); }
        .year-tag { position: absolute; top: 8px; right: 8px; background: #000; color: white; font-weight: 900; font-size: 9px; padding: 2px 6px; border-radius: 6px; z-index: 2; border: 1px solid var(--glass); }
        .count-badge { position: absolute; top: 32px; left: 8px; background: var(--accent); color: #000; font-weight: 900; font-size: 10px; padding: 2px 6px; border-radius: 6px; z-index: 2; }
        .quality-tag { position: absolute; bottom: 35px; right: 8px; background: rgba(0,0,0,0.8); border: 1px solid var(--accent); color: var(--accent); font-size: 9px; padding: 2px 4px; border-radius: 4px; z-index: 2; }

        .load-more-btn { background: var(--surface); border: 1px solid var(--glass); color: var(--accent); width: calc(100% - 30px); margin: 10px 15px; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; text-align: center; }

        .card-actions { position: absolute; top: 32px; right: 8px; display: flex; flex-direction: column; gap: 5px; }
        .mini-btn { background: rgba(0,0,0,0.7); border: 1px solid var(--glass); color: white; width: 28px; height: 28px; border-radius: 6px; font-size: 10px; display: flex; align-items: center; justify-content: center; }

        .full-modal { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; overflow-y: auto; padding-bottom: 40px; }
        .cast-scroll, .poster-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        
        .cast-item { flex: 0 0 90px; text-align: center; }
        .cast-item img { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; margin-bottom: 5px; border: 1px solid var(--glass); }
        .cast-item .char { font-size: 9px; color: var(--accent); display: block; }

        .poster-item { flex: 0 0 110px; position: relative; border-radius: 8px; overflow: hidden; }
        .poster-item img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }

        .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
        .popup-card { background: var(--surface); width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; border: 1px solid var(--accent); overflow-y: auto; max-height: 90vh; }
        .popup-card input { width: 100%; background: #0a0f1a; border: 1px solid var(--glass); color: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        
        .action-btn { background: var(--grad); border: none; color: white; padding: 14px; border-radius: 12px; font-weight: bold; display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; cursor: pointer; }
        .action-btn.outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        
        nav.bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(10, 15, 25, 0.95); display: flex; align-items: center; border-top: 1px solid var(--glass); z-index: 1000; }
        .nav-item { text-align: center; color: var(--text-dim); flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 20px; border-radius: 30px; font-weight: bold; z-index: 4000; display: none; }
        
        .filmo-tabs { display: flex; gap: 10px; margin: 15px 0; border-bottom: 1px solid var(--glass); padding-bottom: 10px; }
        .tab { color: var(--text-dim); font-size: 14px; cursor: pointer; padding: 5px 10px; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .artplayer-app { width: 100%; height: 100%; }
        .trailer-container { margin: 20px 0; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--glass); aspect-ratio: 16/9; }
        .meta-pill { background: var(--glass); padding: 4px 10px; border-radius: 8px; font-size: 11px; }
        
        .review-card { background: var(--glass); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
        .review-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
        .review-content { font-size: 13px; line-height: 1.5; max-height: 100px; overflow-y: auto; }
        
        .saved-info-card { background: rgba(0, 242, 255, 0.1); padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px solid var(--accent); }
        .saved-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
        .saved-label { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <header class="glass-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="margin:0; font-size: 24px;">PREMEO<span style="color:var(--accent)">.</span></h1>
            <i class="fa-solid fa-circle-user" style="font-size: 24px; color: var(--text-dim)"></i>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-dim)"></i>
            <input type="text" id="mainSearch" placeholder="Search movies, actors..." onkeyup="if(event.key==='Enter') performSearch(this.value)">
        </div>
    </header>

    <main id="app-content">
        <div id="search-section" style="display:none">
            <div class="section-header"><h3>Results</h3><span onclick="closeSearch()" class="see-all">Close X</span></div>
            <div id="searchGrid" class="content-grid"></div>
        </div>

        <div id="home-sections">
            <div class="section-header"><h3>Trending Movies</h3><span class="see-all" onclick="seeAll('movie', 'trending')">See All</span></div>
            <div id="trendingMovies" class="horizontal-scroll"></div>

            <div class="section-header"><h3>Trending TV Shows</h3><span class="see-all" onclick="seeAll('tv', 'trending')">See All</span></div>
            <div id="trendingTV" class="horizontal-scroll"></div>

            <div class="section-header"><h3>Top Rated</h3></div>
            <div id="topRatedGrid" class="content-grid"></div>
            <div class="load-more-btn" id="loadMoreBtn" onclick="loadMoreTopRated()">Load More (20)</div>
        </div>

        <div id="library-section" style="display:none">
            <div class="section-header"><h3>My Dedicated Library</h3></div>
            <div id="libraryGrid" class="content-grid"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="navTo('home', this)"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item" id="nav-lib" onclick="navTo('library', this)"><i class="fa-solid fa-clapperboard"></i><span>Library</span></div>
    </nav>

    <div id="detailsModal" class="full-modal"></div>

    <div id="libPopup" class="popup-overlay">
        <div class="popup-card">
            <h2 id="popTitle" style="margin:0 0 15px 0">Advanced Save</h2>
            <input type="hidden" id="edit-idx">
            <input type="text" id="lib-url" placeholder="Main Stream Link (Required)">
            <input type="text" id="lib-ep-url" placeholder="Direct Episode Link (Optional)">
            <input type="text" id="lib-size" placeholder="File Size (e.g. 1.2 GB)">
            <input type="text" id="lib-qual" placeholder="Quality (e.g. 4K, 1080p)">
            <input type="text" id="lib-cat" placeholder="Category (Action, Horror, etc.)">
            
            <input type="text" id="lib-trailer" placeholder="Custom Trailer ID (YouTube)">
            <input type="text" id="lib-poster" placeholder="Custom Poster URL">
            <input type="text" id="lib-imdb" placeholder="IMDB Link">

            <div id="series-inputs" style="display:none; grid-template-columns:1fr 1fr; gap:10px">
                <input type="number" id="lib-s" placeholder="Season">
                <input type="number" id="lib-e" placeholder="Episode">
            </div>
            <button class="action-btn" id="saveBtn" onclick="saveToLibrary()">Save Item</button>
            <button onclick="document.getElementById('libPopup').style.display='none'" style="width:100%; background:none; border:none; color:white; opacity:0.5; margin-top:10px">Cancel</button>
        </div>
    </div>

    <div id="globalToast" class="toast"></div>

    <script>
        const API_KEY = "88649105198c3eecb4d2d6091d7ce972";
        const IMG = "https://image.tmdb.org/t/p/w500";
        const ORIG = "https://image.tmdb.org/t/p/original";
        let db = JSON.parse(localStorage.getItem('premeo_v6_5')) || { lib: [] };
        let tempItem = null;
        let navStack = [];
        let art = null;
        let topPage = 1;

        window.onload = () => { 
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            }, 800);
            fetchHomeData(); 
            renderLibrary(); 
        };

        async function fetchHomeData() {
            const [m, t, top] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}`).then(r => r.json()),
                fetch(`https://api.themoviedb.org/3/trending/tv/day?api_key=${API_KEY}`).then(r => r.json()),
                fetch(`https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}&page=1`).then(r => r.json())
            ]);
            
            renderItems(m.results, 'trendingMovies', 'movie', 'scroll');
            renderItems(t.results, 'trendingTV', 'tv', 'scroll');
            renderItems(top.results, 'topRatedGrid', 'movie', 'grid');
        }

        async function loadMoreTopRated() {
            topPage++;
            const res = await fetch(`https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}&page=${topPage}`);
            const data = await res.json();
            renderItems(data.results, 'topRatedGrid', 'movie', 'grid', true);
        }

        async function seeAll(type, cat) {
            const res = await fetch(`https://api.themoviedb.org/3/${cat}/${type}/day?api_key=${API_KEY}`);
            const data = await res.json();
            document.getElementById('search-section').style.display = 'block';
            document.getElementById('home-sections').style.display = 'none';
            renderItems(data.results, 'searchGrid', type, 'grid');
            window.scrollTo(0,0);
        }

        function renderItems(items, targetId, type, mode, append = false) {
            const html = items.map(i => {
                const year = (i.release_date || i.first_air_date || '0000').substring(0,4);
                const rating = i.vote_average ? i.vote_average.toFixed(1) : '0.0';
                return `
                <div class="m-card" onclick="openDetails('${type || i.media_type}', ${i.id})">
                    <div class="rating-tag">${rating}</div>
                    <div class="year-tag">${year}</div>
                    <img src="${IMG + (i.poster_path || i.profile_path)}" loading="lazy">
                    <div class="info">${i.title || i.name}</div>
                </div>`;
            }).join('');
            if(append) document.getElementById(targetId).innerHTML += html;
            else document.getElementById(targetId).innerHTML = html;
        }

        async function performSearch(q) {
            if(!q) return;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}`);
            const data = await res.json();
            document.getElementById('search-section').style.display = 'block';
            document.getElementById('home-sections').style.display = 'none';
            renderItems(data.results.filter(i => i.poster_path || i.profile_path), 'searchGrid');
            window.scrollTo(0,0);
        }

        async function openDetails(type, id, pushToStack = true) {
            if(type === 'person') return showPersonDetails(id);
            if(pushToStack && document.getElementById('detailsModal').style.display === 'block') {
                navStack.push(document.getElementById('detailsModal').innerHTML);
            }

            document.getElementById('loader').style.display = 'flex';
            document.getElementById('loader').style.opacity = '1';

            try {
                // FETCHING REVIEWS AND OTHER DETAILS
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&append_to_response=credits,videos,images,similar,reviews`);
                const d = await res.json();
                
                // TRAILER LOGIC
                const trailer = d.videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube') || d.videos.results[0];
                const trailerHtml = trailer ? `<div class="trailer-container"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/${trailer.key}" frameborder="0" allowfullscreen></iframe></div>` : '';

                // SAVE ITEM FOR AUTO POST
                tempItem = { 
                    id: d.id, 
                    type, 
                    title: d.title || d.name, 
                    poster: d.poster_path, 
                    backdrop: d.backdrop_path, 
                    date: d.release_date || d.first_air_date, 
                    rating: d.vote_average, 
                    genres: d.genres.map(g => g.name).join(', '),
                    overview: d.overview
                };
                
                const libEntry = db.lib.find(item => item.id == id && item.type == type);
                const directWatchBtn = libEntry ? `<button class="action-btn" onclick="playLibrary(${db.lib.indexOf(libEntry)})" style="background:#ff0055; margin-bottom:10px"><i class="fa-solid fa-play"></i> DIRECT STREAM</button>` : '';

                // MY ADDED DETAILS (LIBRARY INFO)
                let libInfoHtml = '';
                if(libEntry) {
                    libInfoHtml = `
                    <div class="saved-info-card">
                        <div class="saved-row"><span class="saved-label">Quality:</span> <span>${libEntry.qual || 'N/A'}</span></div>
                        <div class="saved-row"><span class="saved-label">Size:</span> <span>${libEntry.size || 'N/A'}</span></div>
                        <div class="saved-row"><span class="saved-label">Saved On:</span> <span>${libEntry.savedOn}</span></div>
                        ${libEntry.type === 'tv' ? `<div class="saved-row"><span class="saved-label">Progress:</span> <span>S${libEntry.s || '?'} E${libEntry.e || '?'}</span></div>` : ''}
                    </div>`;
                }

                // REVIEWS LOGIC
                const reviewsHtml = d.reviews.results.length > 0 ? 
                    d.reviews.results.slice(0, 3).map(r => `
                        <div class="review-card">
                            <div class="review-header">
                                <span><i class="fa-solid fa-user"></i> ${r.author}</span>
                                <span>${new Date(r.created_at).toLocaleDateString()}</span>
                            </div>
                            <div class="review-content">${r.content.substring(0, 150)}${r.content.length>150?'...':''}</div>
                        </div>
                    `).join('') : '<p style="color:var(--text-dim); font-size:12px">No reviews available.</p>';

                const modal = document.getElementById('detailsModal');
                modal.style.display = 'block';
                modal.scrollTo(0,0);
                modal.innerHTML = `
                    <div style="position:relative">
                        <img src="${ORIG + (d.backdrop_path || d.poster_path)}" style="width:100%; max-height:300px; object-fit:cover">
                        <div style="position:absolute; inset:0; background:linear-gradient(to top, var(--bg), transparent)"></div>
                        <button onclick="goBack()" style="position:absolute; top:20px; left:20px; background:rgba(0,0,0,0.6); color:white; border:none; width:40px; height:40px; border-radius:50%; z-index:10"><i class="fa-solid fa-arrow-left"></i></button>
                    </div>
                    <div style="padding:20px; margin-top:-60px; position:relative; z-index:5">
                        <h1 style="margin:0; text-shadow:0 2px 10px rgba(0,0,0,0.8)">${d.title || d.name}</h1>
                        <div style="margin:10px 0; display:flex; flex-wrap:wrap; gap:5px">
                            <span class="meta-pill">⭐ ${d.vote_average.toFixed(1)}</span>
                            <span class="meta-pill">${d.runtime || d.episode_run_time?.[0] || '?'} min</span>
                            <span class="meta-pill">${(tempItem.date || '0000').substring(0,4)}</span>
                        </div>
                        <div style="font-size:12px; color:var(--accent); margin-bottom:15px">${tempItem.genres}</div>

                        ${directWatchBtn}
                        ${libInfoHtml}

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:15px 0">
                            <button class="action-btn outline" onclick="openLibPopup('${type}')"><i class="fa-solid fa-plus"></i> ${libEntry ? 'EDIT LIB' : 'ADD TO LIB'}</button>
                            <button class="action-btn" style="background:#25d366" onclick="copySocialPost()"><i class="fa-solid fa-share-nodes"></i> AUTO POST</button>
                        </div>

                        <div class="section-header" style="padding:10px 0"><h3>Poster Gallery</h3><span class="see-all" onclick="showFullGallery(${d.id},'${type}')">See All</span></div>
                        <div class="poster-scroll">
                            ${d.images.posters.slice(0,10).map(img => `
                                <div class="poster-item" onclick="copyTxt('${ORIG+img.file_path}', 'Poster URL Copied!')">
                                    <img src="${IMG+img.file_path}">
                                </div>
                            `).join('')}
                        </div>

                        ${trailerHtml}

                        <h3>Overview</h3>
                        <p style="color:var(--text-dim); line-height:1.6; font-size:14px; margin-bottom:30px">${d.overview || 'No overview available.'}</p>

                        <h3>Top Reviews</h3>
                        <div style="margin-bottom:30px">
                            ${reviewsHtml}
                        </div>

                        <h3>Cast & Characters</h3>
                        <div class="cast-scroll">
                            ${d.credits.cast.slice(0,12).map(c => `
                                <div class="cast-item" onclick="showPersonDetails(${c.id})">
                                    <img src="${c.profile_path ? IMG+c.profile_path : 'https://via.placeholder.com/75'}">
                                    <b style="font-size:10px; display:block; white-space:nowrap; overflow:hidden">${c.name}</b>
                                    <span class="char">${c.character}</span>
                                </div>
                            `).join('')}
                        </div>

                        <h3>Similar Content</h3>
                        <div class="horizontal-scroll" style="padding:0">
                            ${d.similar.results.slice(0,10).map(s => `
                                <div class="m-card" onclick="openDetails('${type}', ${s.id})">
                                    <img src="${IMG + (s.poster_path || s.backdrop_path)}">
                                    <div class="info">${s.title || s.name}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
            } catch(e) {
                console.error(e);
                showToast("Error loading details");
            } finally {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            }
        }

        async function showFullGallery(id, type) {
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('loader').style.opacity = '1';
            
            // Push CURRENT content to stack before overwriting
            navStack.push(document.getElementById('detailsModal').innerHTML);

            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}/images?api_key=${API_KEY}`);
            const data = await res.json();
            
            const modal = document.getElementById('detailsModal');
            modal.scrollTo(0,0);
            modal.innerHTML = `<div style="padding:20px">
                <div class="section-header"><h3>All Posters (${data.posters.length})</h3><span onclick="goBack()" class="see-all">Back</span></div>
                <div class="content-grid">
                    ${data.posters.map(p => `<div class="m-card" onclick="copyTxt('${ORIG+p.file_path}', 'Link Copied')"><img src="${IMG+p.file_path}"></div>`).join('')}
                </div>
            </div>`;
            
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        }

        async function showPersonDetails(id) {
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('loader').style.opacity = '1';
            const res = await fetch(`https://api.themoviedb.org/3/person/${id}?api_key=${API_KEY}&append_to_response=combined_credits`);
            const p = await res.json();
            const modal = document.getElementById('detailsModal');
            modal.style.display = 'block';
            modal.scrollTo(0,0);
            
            const movies = p.combined_credits.cast.filter(i => i.media_type === 'movie' && i.poster_path).sort((a,b) => (b.release_date || '0').localeCompare(a.release_date || '0'));
            const tv = p.combined_credits.cast.filter(i => i.media_type === 'tv' && i.poster_path).sort((a,b) => (b.first_air_date || '0').localeCompare(a.first_air_date || '0'));
            
            modal.innerHTML = `
                <div style="padding:20px">
                    <button onclick="goBack()" style="background:var(--surface); border:none; color:white; padding:10px 15px; border-radius:10px; margin-bottom:15px"><i class="fa-solid fa-chevron-left"></i> Back</button>
                    <div style="display:flex; gap:20px; align-items:center">
                        <img src="${IMG + p.profile_path}" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:2px solid var(--accent)">
                        <div><h2 style="margin:0">${p.name}</h2><p style="color:var(--accent)">${p.known_for_department}</p></div>
                    </div>
                    <p style="font-size:13px; color:var(--text-dim); margin-top:15px">${p.biography ? p.biography.substring(0,300)+'...' : 'No bio available.'}</p>
                    <div class="filmo-tabs">
                        <div class="tab active" onclick="switchFilmo('movie', this)">Movies (${movies.length})</div>
                        <div class="tab" onclick="switchFilmo('tv', this)">TV Shows (${tv.length})</div>
                    </div>
                    <div id="filmo-content" class="content-grid" style="padding:0">
                        ${movies.map((i, idx) => `
                            <div class="m-card" onclick="openDetails('movie', ${i.id})">
                                <div class="count-badge">${idx + 1}</div>
                                <img src="${IMG + i.poster_path}">
                                <div class="info">${i.title}<br><span style="font-size:8px; opacity:0.7">${(i.release_date || '').substring(0,4)}</span></div>
                            </div>`).join('')}
                    </div>
                </div>`;
            window.currentFilmo = { movies, tv };
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        }

        function switchFilmo(type, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            const data = type === 'movie' ? window.currentFilmo.movies : window.currentFilmo.tv;
            document.getElementById('filmo-content').innerHTML = data.map((i, idx) => `
                <div class="m-card" onclick="openDetails('${type}', ${i.id})">
                    <div class="count-badge">${idx + 1}</div>
                    <img src="${IMG + i.poster_path}">
                    <div class="info">${i.title || i.name}<br><span style="font-size:8px; opacity:0.7">${(i.release_date || i.first_air_date || '').substring(0,4)}</span></div>
                </div>`).join('');
        }

        function openLibPopup(type, editIdx = -1) {
            const isEdit = editIdx > -1;
            document.getElementById('libPopup').style.display = 'flex';
            document.getElementById('edit-idx').value = editIdx;
            
            // Show/Hide series inputs based on type
            const seriesInputs = document.getElementById('series-inputs');
            seriesInputs.style.display = (type === 'tv' ? 'grid' : 'none');

            if(isEdit) {
                const item = db.lib[editIdx];
                document.getElementById('lib-url').value = item.url || '';
                document.getElementById('lib-ep-url').value = item.epUrl || '';
                document.getElementById('lib-size').value = item.size || '';
                document.getElementById('lib-qual').value = item.qual || '';
                document.getElementById('lib-cat').value = item.cat || '';
                document.getElementById('lib-trailer').value = item.trailer || '';
                document.getElementById('lib-poster').value = item.customPoster || '';
                document.getElementById('lib-imdb').value = item.imdb || '';
                document.getElementById('lib-s').value = item.s || '';
                document.getElementById('lib-e').value = item.e || '';
            } else {
                ['lib-url','lib-ep-url','lib-size','lib-qual','lib-cat','lib-s','lib-e','lib-trailer','lib-poster','lib-imdb'].forEach(id => document.getElementById(id).value = '');
            }
        }

        function saveToLibrary() {
            const url = document.getElementById('lib-url').value;
            if(!url) return showToast("Stream Link is required!");
            const editIdx = parseInt(document.getElementById('edit-idx').value);
            const item = { 
                ...(editIdx > -1 ? db.lib[editIdx] : tempItem), 
                url, 
                epUrl: document.getElementById('lib-ep-url').value,
                size: document.getElementById('lib-size').value,
                qual: document.getElementById('lib-qual').value,
                cat: document.getElementById('lib-cat').value,
                trailer: document.getElementById('lib-trailer').value,
                customPoster: document.getElementById('lib-poster').value,
                imdb: document.getElementById('lib-imdb').value,
                s: document.getElementById('lib-s').value, 
                e: document.getElementById('lib-e').value, 
                savedOn: new Date().toLocaleDateString() 
            };
            if(editIdx > -1) db.lib[editIdx] = item;
            else db.lib.unshift(item);
            localStorage.setItem('premeo_v6_5', JSON.stringify(db));
            renderLibrary();
            document.getElementById('libPopup').style.display = 'none';
            showToast("Saved!");
        }

        function renderLibrary() {
            const grid = document.getElementById('libraryGrid');
            if(db.lib.length === 0) { grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; opacity:0.3; padding:40px">Library Empty</p>'; return; }
            grid.innerHTML = db.lib.map((i, idx) => `
                <div class="m-card">
                    <img src="${i.customPoster || (IMG + i.poster)}" onclick="playLibrary(${idx})">
                    ${i.qual ? `<div class="quality-tag">${i.qual}</div>` : ''}
                    <div class="card-actions">
                        <button class="mini-btn" onclick="openLibPopup('${i.type}', ${idx})"><i class="fa-solid fa-pen"></i></button>
                    </div>
                    <div class="info" onclick="playLibrary(${idx})">
                        ${i.title}
                        ${i.type === 'tv' && i.s ? `<br><span style="color:var(--accent)">S${i.s} E${i.e}</span>` : ''}
                    </div>
                </div>`).join('');
        }

        async function playLibrary(idx) {
            const i = db.lib[idx];
            const modal = document.getElementById('detailsModal');
            modal.style.display = 'block';
            modal.innerHTML = `<div style="width:100%; aspect-ratio:16/9; background:#000;"><div class="artplayer-app"></div></div>
            <div style="padding:20px"><h2>${i.title}</h2><button onclick="closeModal()" class="action-btn">Close Player</button></div>`;
            if(art) art.destroy();
            // Use Direct Episode URL if available, else Main URL
            const playUrl = i.epUrl || i.url;
            art = new Artplayer({ container: '.artplayer-app', url: playUrl, autoplay: true, fullscreen: true, theme: '#00f2ff' });
        }

        function copySocialPost() {
            if(!tempItem) return;
            const link = db.lib.find(i => i.id == tempItem.id && i.type == tempItem.type)?.url || 'Link coming soon!';
            const text = `🎬 *${tempItem.title}* (${(tempItem.date||'').substring(0,4)})
⭐ Rating: ${Number(tempItem.rating).toFixed(1)}/10
🎭 Genres: ${tempItem.genres}

📝 *Overview:*
${tempItem.overview || 'No overview available.'}

🔗 *Watch Now:* ${link}

#${tempItem.title.replace(/[^a-zA-Z0-9]/g, '')} #Movie #PremEO`;
            
            navigator.clipboard.writeText(text).then(() => {
                showToast("Advance Long Post Copied!");
            }).catch(err => {
                showToast("Failed to copy!");
            });
        }

        function copyTxt(t, m = "Copied!") { navigator.clipboard.writeText(t); showToast(m); }
        function goBack() { 
            if(navStack.length > 0) { 
                document.getElementById('detailsModal').innerHTML = navStack.pop(); 
                // Re-attach event listeners if needed (not needed for simple HTML replacement here)
            } else { 
                closeModal(); 
            } 
        }
        function closeModal() { if(art) art.destroy(); document.getElementById('detailsModal').style.display = 'none'; navStack = []; }
        function showToast(m) { const t=document.getElementById('globalToast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); }
        
        function navTo(p, el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('home-sections').style.display = p === 'home' ? 'block' : 'none';
            document.getElementById('library-section').style.display = p === 'library' ? 'block' : 'none';
            document.getElementById('search-section').style.display = 'none';
        }
        function closeSearch() { document.getElementById('search-section').style.display='none'; document.getElementById('home-sections').style.display = 'block'; }
    </script>
</body>
</html>
