
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault | Pro Mobile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <a href="admin/admin.html" class="admin-fab">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </a>

    <nav>
        <div class="nav-container">
            <div class="brand">STREAM<span>VAULT</span></div>
            <div class="search-bar">
                <input type="text" id="search" placeholder="Search movies...">
            </div>
        </div>
    </nav>

    <header class="hero">
        <div style="font-size:12px; font-weight:bold; color:var(--primary); margin-bottom:5px;">#1 TRENDING</div>
        <h1>Latest Releases</h1>
        <p>Premium direct downloads for the latest cinema and series.</p>
    </header>

    <main class="container">
        <h2 style="margin-bottom: 20px; font-size: 1.2rem;">Recent Uploads</h2>
        <div id="loader" style="text-align: center; padding: 50px;">Loading Vault...</div>
        <div id="grid" class="grid"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { /* PASTE CONFIG HERE */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const grid = document.getElementById('grid');
        const loader = document.getElementById('loader');

        onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), (snap) => {
            loader.style.display = 'none';
            grid.innerHTML = snap.docs.map(doc => {
                const p = doc.data();
                return `
                    <div class="card">
                        <div class="poster-box">
                            <img src="${p.posterURL}" loading="lazy">
                        </div>
                        <div class="card-body">
                            <div class="card-title">${p.title}</div>
                            <div style="font-size:11px; color:#aaa; margin-bottom:10px;">S${p.season}E${p.episode} • ${p.quality}</div>
                            <a href="${p.downloadURL}" class="btn-dl">Download</a>
                        </div>
                    </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
