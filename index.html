<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault | Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-flex">
            <div class="brand">STREAMVAULT</div>
            <div id="authSlot"><button class="btn btn-red" onclick="login()" style="padding:5px 15px; width:auto;">Login</button></div>
        </div>
    </nav>

    <main class="container">
        <div id="userTabs" style="display:none; margin-bottom:20px; gap:10px;">
            <button onclick="setView('home')" class="btn btn-main" style="width:auto;">Latest</button>
            <button onclick="setView('req')" class="btn btn-red" style="width:auto;">Request Movie</button>
        </div>

        <div id="movieGrid" class="grid"></div>

        <div id="reqSection" class="request-box" style="display:none; max-width:500px; margin:auto;">
            <h3>New Request</h3>
            <input type="text" id="reqTitle" placeholder="Enter Movie or Series name...">
            <button id="submitReq" class="btn btn-red">Submit to Admin</button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARmXoxU0rLXLGZa4Tz1JtYzo4HjwrM-s8",
            authDomain: "mrxencodes.firebaseapp.com",
            projectId: "mrxencodes",
            storageBucket: "mrxencodes.firebasestorage.app",
            messagingSenderId: "595967941836",
            appId: "1:595967941836:web:9697bd551fab52f3167669"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email === "mynewp570@gmail.com") {
                    window.location.href = "admin/admin.html";
                } else {
                    document.getElementById('authSlot').innerHTML = `<button onclick="signOut(auth)" style="background:none; border:none; color:white; font-size:12px; cursor:pointer;">Logout</button>`;
                    document.getElementById('userTabs').style.display = 'flex';
                }
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.setView = (v) => {
            document.getElementById('movieGrid').style.display = v === 'home' ? 'grid' : 'none';
            document.getElementById('reqSection').style.display = v === 'req' ? 'block' : 'none';
        };

        document.getElementById('submitReq').onclick = async () => {
            const t = document.getElementById('reqTitle').value;
            if(!t) return alert("Enter a title");
            await addDoc(collection(db, "requests"), {
                title: t,
                userName: auth.currentUser.displayName,
                createdAt: serverTimestamp()
            });
            alert("Sent!");
            document.getElementById('reqTitle').value = '';
            setView('home');
        };

        onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), (snap) => {
            document.getElementById('movieGrid').innerHTML = snap.docs.map(d => `
                <div class="movie-card">
                    <div class="poster-wrap"><img src="${d.data().posterURL}"></div>
                    <div class="card-body">
                        <div class="card-title">${d.data().title}</div>
                        <a href="${d.data().downloadURL}" class="btn btn-main" target="_blank">Download</a>
                    </div>
                </div>`).join('');
        });
    </script>
</body>
</html>
